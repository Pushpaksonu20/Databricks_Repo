# This is a Declarative Automation Bundle definition for dab_tutorial.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: dab_tutorial
  uuid: 4f5eb615-2731-49d3-9e56-432faa78e0ae

include: #Added Manually
  - resources/*.yml
  - resources/*.yaml
  - resources/*/*.yml
  - resources/*/*.yaml #Added Manually

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: dbc-a71339d9-c4e1.cloud.databricks.com # change this , by going to compute , connections , hostname of dev environment

    variables:
      catalog: no
      schema: dev
    permissions: #Changed manually
      - group_name: admins
        level: CAN_MANAGE
    presets: #Changed Manually
      name_prefix: ${workspace.current_user.short_name}
      source_linked_deployment: false # if it's false , the file path of the deployed job will be picked from .bundle folder rather than the actual path
  prod:
    mode: production
    workspace:
      host: dbc-a71339d9-c4e1.cloud.databricks.com # change this , by going to compute , connections , hostname of prod environment
      # We explicitly deploy to /Workspace/Users/pushpak.lsonu@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/PROD/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: no
      schema: prod
    permissions:
      - user_name: pushpak.lsonu@gmail.com
        level: CAN_MANAGE
      - group_name: admins
        level: CAN_RUN
